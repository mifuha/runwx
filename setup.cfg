[metadata]
name = runwx
version = 0.0.1

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    pydantic>=2,<3
    httpx>=0.27,<0.28
    beautifulsoup4>=4.12,<5
    tzdata>=2024.1
    google-cloud-storage>=3,<4

[options.packages.find]
where = src

[options.extras_require]
bigquery =
    google-cloud-bigquery>=3,<4
api =
    fastapi>=0.141,<0.142
    uvicorn>=0.35,<1

[options.package_data]
runwx.adapters.bigquery = result_rows.schema.json
runwx.api =
    static/*.html
    static/*.css
    static/*.js
