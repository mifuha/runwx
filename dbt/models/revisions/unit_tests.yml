  config: *id001
  given:
  - *id002
  - *id003
  - &id007
    input: source('revision_preview', 'revision_attempts')
    rows:
    - *id004
    - attempt_id: attempt-b1
      revision_id: revision-b
      status: failed
      validation_scope: warehouse
      validation_code_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      validation_invocation_id: synthetic-test-receipt-not-a-real-execution
    - *id005
    - *id006
  - input: source('revision_preview', 'event_selections')
    rows:
    - &id012
      event_id: eventrac:900001
      revision_id: revision-a
      successful_attempt_id: attempt-a1
  expect:
    rows:
    - revision_id: revision-a
      source_row_number: 1
      validation_status: accepted
      duration_s: 3600
      weather_match_status: matched
    - revision_id: revision-a
      source_row_number: 2
      validation_status: accepted
      duration_s: 7200
      weather_match_status: matched
    - revision_id: revision-a
      source_row_number: 3
      validation_status: accepted
      duration_s: 14400
      weather_match_status: unmatched
    - revision_id: revision-a
      source_row_number: 4
      validation_status: skipped
      duration_s: null
      weather_match_status: not_applicable
    - revision_id: revision-a
      source_row_number: 5
      validation_status: invalid
      duration_s: null
      weather_match_status: not_applicable
