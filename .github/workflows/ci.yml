name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[bigquery]'
          pip install pytest

      - name: Run tests
        run: pytest -q

  report-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build report image
        run: docker build --tag runwx-report-ci .

      - name: Check report command offline
        run: docker run --rm --network none --read-only runwx-report-ci --help

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Install locked providers without a backend
        run: terraform init -backend=false -lockfile=readonly -input=false -no-color

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Validate historical warehouse root
        run: |
          terraform -chdir=historical init -backend=false -lockfile=readonly -input=false -no-color
          terraform -chdir=historical validate -no-color

  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dbt image
        run: docker build --tag runwx-dbt-ci dbt

      - name: Parse default models offline
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          runwx-dbt-ci --no-partial-parse parse --profiles-dir . --target local

      - name: Parse comparison models offline
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --env RUNWX_DBT_DATASET=runwx_dbt_comparison_ci
          runwx-dbt-ci --no-partial-parse parse --profiles-dir . --target local
          --vars '{"comparison_datasets": ["edition_a", "edition_b"], "comparison_baseline": "edition_a"}'
